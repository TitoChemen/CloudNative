server:
  port: 0

spring:
  application:
    name: mensajeria-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  rabbitmq:
    addresses: ${SPRING_RABBITMQ_ADDRESSES:localhost:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # ACK explícito en cada consumidor (ver AckHandler)
        acknowledge-mode: manual
        # Un fallo nunca vuelve a la cola principal: se envía a la DLQ
        default-requeue-rejected: false
        prefetch: 1

rabbitmq:
  retry:
    # Reintentos solo para errores recuperables (p. ej. SMTP caído)
    max-attempts: ${RABBITMQ_RETRY_MAX_ATTEMPTS:3}
    initial-interval-ms: ${RABBITMQ_RETRY_INITIAL_INTERVAL_MS:2000}
    multiplier: ${RABBITMQ_RETRY_MULTIPLIER:2.0}
  dlq:
    # false: los mensajes fallidos quedan en la DLQ (visibles en el dashboard)
    # true : DlqListener los registra en log y los retira de la DLQ
    listeners-enabled: ${RABBITMQ_DLQ_LISTENERS_ENABLED:false}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    instance-id: ${spring.application.name}:${random.value}
    prefer-ip-address: true