version: '3.8'

services:
  # Base de Datos MySQL
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-net

  # Eureka Server
  eureka-server:
    build: ./Eureka-Server
    container_name: eureka-server
    restart: on-failure
    ports:
      - "8761:8761"
    networks:
      - microservices-net

  # Config Server
  config-server:
    build: ./config-server
    container_name: config-server
    restart: on-failure
    ports:
      - "8888:8888"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_started
    networks:
      - microservices-net

  # API Gateway
  api-gateway:
    build: ./Api-Gateway
    container_name: api-gateway
    restart: on-failure
    ports:
      - "9000:9000"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
    networks:
      - microservices-net

  # --- KAFKA & ZOOKEEPER ---
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - microservices-net

  kafka:
    image: confluentinc/cp-kafka:7.3.2
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTERBROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 29092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
    networks:
      - microservices-net

  # --- CLUSTER RABBITMQ ---
  rabbitmq1:
    image: rabbitmq:3-management
    container_name: rabbitmq-node1
    hostname: rabbitmq1
    restart: always
    environment:
      RABBITMQ_ERLANG_COOKIE: "SECRET_COOKIE_RABBITMQ_CLUSTER"
      RABBITMQ_NODENAME: "rabbit@rabbitmq1"
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-net

  rabbitmq2:
    image: rabbitmq:3-management
    container_name: rabbitmq-node2
    hostname: rabbitmq2
    restart: always
    environment:
      RABBITMQ_ERLANG_COOKIE: "SECRET_COOKIE_RABBITMQ_CLUSTER"
      RABBITMQ_NODENAME: "rabbit@rabbitmq2"
    depends_on:
      rabbitmq1:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        rabbitmq-server &
        until rabbitmq-diagnostics -q ping; do sleep 2; done
        rabbitmqctl stop_app
        rabbitmqctl join_cluster rabbit@rabbitmq1
        rabbitmqctl start_app
        wait
    networks:
      - microservices-net

  # --- MICROSERVICIOS ---
  usuario-service:
    build: ./usuario-service
    container_name: usuario-service
    restart: on-failure
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/bd_usuario?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_RABBITMQ_ADDRESSES=rabbitmq1:5672,rabbitmq2:5672
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MAIL_USERNAME=pedido360@kevinsosag.onmicrosoft.com
      - MAIL_PASSWORD=Mofu803407
    depends_on:
      config-server:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - microservices-net

  producto-service:
    build: ./producto-service
    container_name: producto-service
    restart: on-failure
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/bd_producto?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_RABBITMQ_ADDRESSES=rabbitmq1:5672,rabbitmq2:5672
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      config-server:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - microservices-net

  mensajeria-service:
    build: ./mensajeria-service
    container_name: mensajeria-service
    restart: on-failure
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - SPRING_RABBITMQ_ADDRESSES=rabbitmq1:5672,rabbitmq2:5672
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_MAIL_HOST=smtp.gmail.com
      - SPRING_MAIL_PORT=587
      - SPRING_MAIL_USERNAME=offgdev@gmail.com
      - SPRING_MAIL_PASSWORD=mffekeaafoetuztr
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
    depends_on:
      rabbitmq1:
        condition: service_healthy
      config-server:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - microservices-net

  pago-service:
    build: ./pago-service
    container_name: pago-service
    restart: on-failure
    ports:
      - "8087:8086"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - SPRING_RABBITMQ_ADDRESSES=rabbitmq1:5672,rabbitmq2:5672
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      rabbitmq1:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - microservices-net

  # Frontend (Nginx con soporte HTTPS y SPA)
  frontend:
    build: ./frontend
    container_name: frontend-app
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - microservices-net

volumes:
  mysql_data:

networks:
  microservices-net:
    driver: bridge