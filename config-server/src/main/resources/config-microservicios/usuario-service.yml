server:
  port: 0
  address: 0.0.0.0

spring:
  application:
    name: usuario-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://login.microsoftonline.com/8680c901-cdee-41fb-b489-95b35c8ffaf0/discovery/v2.0/keys
          issuer-uri: https://login.microsoftonline.com/8680c901-cdee-41fb-b489-95b35c8ffaf0/v2.0
  flyway:
    enabled: true
    repair-on-migrate: true
    clean-on-validation-error: true
  datasource:
    # Cambiar 'bd_usuario' por la base de datos correspondiente a cada servicio
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bd_usuario}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  cloud:
    config:
      request-connect-timeout: 2000
      request-read-timeout: 5000
      fail-fast: false
    loadbalancer:
      enabled: true
  # Conexión a RabbitMQ anidada en spring
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    instance-id: \({spring.application.name}:\){random.value}
    prefer-ip-address: true

# Configuración personalizada de colas y exchanges para el servicio
rabbitmq:
  exchanges:
    principal: "cloudnative.exchange"
  queues:
    notificaciones: "notificaciones.queue"
    tickets: "tickets.queue"
    dlq: "cloudnative.dlq"
  routing-keys:
    notificaciones: "routing.notificaciones"
    tickets: "routing.tickets"
    dlq: "routing.dlq"